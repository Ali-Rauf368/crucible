name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: crucible, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: crucible_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U crucible" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://crucible@localhost:5432/crucible_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Example: gate an agent change on Crucible (needs a reachable Crucible and a `ci`-scoped key)
  agent-gate:
    if: ${{ vars.CRUCIBLE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Resilience gate
        run: node scripts/crucible-ci.mjs --suite support-resilience --agent support-hardened
        env: { CRUCIBLE_URL: "${{ vars.CRUCIBLE_URL }}", CRUCIBLE_KEY: "${{ secrets.CRUCIBLE_KEY }}" }
      - name: Red-team gate
        run: node scripts/crucible-ci.mjs --suite redteam-injection --agent support-hardened
        env: { CRUCIBLE_URL: "${{ vars.CRUCIBLE_URL }}", CRUCIBLE_KEY: "${{ secrets.CRUCIBLE_KEY }}" }
